[package]
name = "mdpeek"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "Terminal Markdown reader with Mermaid diagrams"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CptPhenomeno/mdpeek"
publish = false

[dependencies]
base64 = "0.22.1"
clap = { version = "4.6.8", features = ["derive"] }
crossterm = "0.29.0"
ignore = "0.4.34"
image = "0.25.10"
merman = { version = "0.10.0", default-features = false, features = ["svg", "native-fonts", "layout-cytoscape", "ascii", "diagram-flowchart", "diagram-sequence", "diagram-class", "diagram-gantt", "diagram-mindmap", "diagram-state", "diagram-pie"] }
open = "5.4.5"
pulldown-cmark = "0.13.6"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["image-defaults", "crossterm"] }
resvg = "0.50.0"
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
unicode-width = "0.2.3"
rustix = { version = "1.1.6", default-features = false, features = ["event", "stdio", "std"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
