on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-latest, os: linux, arch: amd64 }
          - { runner: ubuntu-24.04-arm, os: linux, arch: arm64 }
    steps:
      - name: Checkout mdpeek
        uses: actions/checkout@v7.0.1

      - name: Check tag, version and release notes
        run: |
          ./.github/scripts/check-version.sh "${GITHUB_REF_NAME}"
          ./.github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > /dev/null

      - name: Setup
        uses: ./.github/actions/setup-and-check

      - name: Create binary
        run: make dist

      - name: Upload binary
        uses: actions/upload-artifact@v7.0.2
        with:
          name: mdpeek-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/mdpeek-*
          if-no-files-found: error

  release:
    name: Release mdpeek
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mdpeek
        uses: actions/checkout@v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          pattern: mdpeek-*
          merge-multiple: true

      - name: Compute Checksums
        run: cd dist && sha256sum mdpeek-* > checksums.txt

      - name: Extract release notes
        run: ./.github/scripts/release-notes.sh "${GITHUB_REF_NAME}" > release.md

      - name: Create Github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --notes-file release.md dist/mdpeek-* dist/checksums.txt
