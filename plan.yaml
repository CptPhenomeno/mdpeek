              Links and diagrams are the focusable items of a document (SPEC §2, §3.6.1).
              Scope: focus state over the layout's focusables; Tab / Shift+Tab move to the next / previous item in document order, scrolling it into view; focus starts on nothing; Esc clears it; the focused link is drawn in reverse video and a focused diagram is visibly marked; focus survives relayouts.
