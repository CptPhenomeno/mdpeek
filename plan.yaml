# readmd delivery plan, derived from SPEC.md (approved).
#
# Structure: epic > story > task. Points live on tasks only (stories and
# epics show the derived sum). Dependencies are declared task-to-task with
# `blocks` so that `kb next` yields: skeleton -> spikes and pure-logic
# modules -> first rendered vertical slice -> pictures -> navigation ->
# acceptance.
#
# Common DoD (SPEC §5), repeated as an acceptance criterion on every task:
#   - tests written first (red -> green -> refactor) for all logic in cli,
#     doc, highlight, layout, diagram, raster, tree and for UI key handling;
#   - UI rendering covered by insta snapshot tests on ratatui TestBackend,
#     with pictures replaced by a placeholder renderer;
#   - cargo fmt --check, cargo clippy --all-targets -- -D warnings and
#     cargo test all clean;
#   - no unwrap()/expect() outside tests and start-up code unless the reason
#     is commented;
#   - code, comments, docs and commit messages in English; no AI attribution
#     lines in commits.

spec: SPEC.md
status: todo
items:
  # ===================================================================
  - ref: foundation
    type: epic
    title: Runnable readmd foundation with rendering risks retired
    spec: SPEC.md#311-architecture-guidance
    priority: high
    tags: [foundation]
    description: |
      readmd is greenfield: only SPEC.md exists, and the two riskiest dependencies (merman + resvg for diagrams, ratatui-image for clipped pictures) are unproven.
      This epic scaffolds the repository and crate, delivers a runnable end-to-end skeleton and then the first rendered vertical slice, and retires the rendering risks with spikes whose findings the picture tasks rely on.
      Common DoD for every task (SPEC §5): tests first (red, green, refactor); UI rendering covered by insta snapshots on TestBackend with a placeholder picture renderer; cargo fmt --check, cargo clippy --all-targets -- -D warnings and cargo test clean; no unwrap()/expect() outside tests and start-up code unless commented; English only; no AI attribution lines in commits.
      Done when `readmd some.md` renders and scrolls a Markdown document and both spike findings are recorded in docs/spikes/.
    acceptance:
      - "readmd FILE.md opens the TUI, renders the document, scrolls and quits leaving the terminal intact"
      - "merman/resvg and ratatui-image findings are recorded in docs/spikes/ and any contradiction with SPEC.md is raised with the user"
    children:
      - ref: walking-skeleton
        type: story
        title: Markdown file opens, renders, scrolls and quits end to end
        spec: SPEC.md#32-screen-layout
        priority: high
        tags: [foundation, ui]
        description: |
          Every later feature should land in an app that already runs, so the path command line -> document -> layout -> screen must exist first.
          A bootstrap task delivers the repository, crate, lint gates and a plain-text viewer; a second task replaces the raw text with the rendered document pane, the scroll keys and the status bar (the thin vertical slice).
          Done when `readmd README.md` shows the rendered Markdown, every scroll key of SPEC §3.8 works and Ctrl+Q / F10 quit cleanly.
        acceptance:
          - "readmd FILE.md shows the rendered document in the alternate screen with the status bar"
          - "Up/Down, PgUp/PgDn, Space, Home/End and the mouse wheel scroll as in SPEC §3.8"
          - "Ctrl+Q and F10 quit; the terminal is restored after a normal exit and after a panic"
        children:
          - ref: skeleton
            type: task
            title: Bootstrapped readmd crate with a plain-text viewer skeleton
            spec: SPEC.md#311-architecture-guidance
            priority: high
            points: 5
            tags: [bootstrap, ui]
            description: |
              Nothing exists besides SPEC.md: every later task needs a git repository, a crate with its dependencies, the lint gates and a binary that already goes from the command line to the screen.
              Scope: `git init` plus a Rust .gitignore (target/, *.snap.new, *.pending-snap, editor files); cargo package `readmd` (binary, edition 2024, rust-version 1.95) with the SPEC §3.11 dependencies (clap, pulldown-cmark, syntect, merman, resvg, image, ratatui, ratatui-image, crossterm, ignore, open) and dev-dependencies (insta, assert_cmd); rustfmt.toml and a [lints] table so `cargo clippy --all-targets -- -D warnings` is the gate; empty modules cli, doc, highlight, layout, diagram, raster, graphics, tree, ui. A minimal path through them: `readmd FILE` reads the file, shows its lines as plain text in the alternate screen, Up/Down scroll one row, Ctrl+Q quits; a panic hook plus a drop guard restore raw mode, alternate screen and cursor (SPEC §3.1.4).
              Done when `cargo run -- SPEC.md` shows the file, scrolls and quits leaving the terminal intact, and fmt, clippy and test are clean.
            acceptance:
              - "git repository initialised with a .gitignore covering target/ and pending insta snapshots"
              - "Cargo.toml declares package readmd, edition 2024, rust-version 1.95 and the SPEC §3.11 dependencies"
              - "the SPEC §3.11 module layout exists (cli, doc, highlight, layout, diagram, raster, graphics, tree, ui)"
              - "readmd FILE shows the file as plain text; Up/Down scroll and Ctrl+Q quits"
              - "raw mode, alternate screen and cursor are restored on normal exit and on panic"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "readmd --version prints the crate name and version"
              - "Down scrolls one row and stops at the last row"
              - "Up does not scroll above the first row"
              - "Ctrl+Q sets the quit flag"
              - "TestBackend snapshot shows the first rows of the file as plain text"
              - "terminal restore routine runs when the panic hook fires (terminal backend mocked)"
            blocks: [spike-merman, spike-clipping, cli-args, doc-blocks, highlight-code, tree-scan, fullscreen-state, ui-doc-pane]

          - ref: ui-doc-pane
            type: task
            title: Rendered document pane with scrolling and status bar
            spec: SPEC.md#38-keys-document-focus
            priority: high
            points: 5
            tags: [ui]
            description: |
              The skeleton shows raw text; this is the first real vertical slice, rendering the laid-out Markdown so the app is usable end to end (SPEC §3.2, §3.8, §4.3, §4.4, §4.6).
              Scope: App state holding the Layout for the current pane width; document pane drawing styled rows with the 1-column margin and a border that is highlighted when focused; status bar with the path relative to the root, scroll percentage, a mode area and transient messages; scroll keys Up/Down (1 row), PgUp/PgDn/Space (page minus one row), Home/End, mouse wheel (3 rows); Ctrl+Q and F10 quit; "Empty document" and "Window too narrow" (< 20 columns) in the pane, "File is not valid UTF-8" in the status bar; relayout on terminal resize keeping the same document position at the top. Introduce a central key map (key -> action table) that later keys and the F1 help share.
              Done when the listed behaviours pass their state and snapshot tests and `readmd README.md` is comfortable to read.
            acceptance:
              - "document pane renders headings, paragraphs and inline styles from the layout with a 1-column margin"
              - "every scroll key of SPEC §3.8 behaves as specified, including mouse wheel = 3 rows"
              - "status bar shows the relative path, scroll percentage, mode area and transient messages"
              - "empty file, narrow window and non-UTF-8 states show the SPEC §4 messages"
              - "keys are dispatched through one central key map"
              - "UI rendering covered by insta snapshots on TestBackend with the placeholder picture renderer (SPEC §5)"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "PgDn scrolls by the pane height minus one row"
              - "Space scrolls one page like PgDn and PgUp scrolls one page back"
              - "End puts the last row at the bottom of the pane and Home returns to the top"
              - "mouse wheel down scrolls three rows"
              - "scroll offset is clamped at the end of the document"
              - "status bar shows the path relative to the root and the scroll percentage"
              - "transient status message is cleared by the next key press"
              - "empty file renders 'Empty document'"
              - "pane narrower than 20 columns renders 'Window too narrow'"
              - "non-UTF-8 file shows 'File is not valid UTF-8' in the status bar"
              - "resize recomputes the layout and keeps the same document position at the top"
              - "F10 and Ctrl+Q quit"
              - "snapshot of a short document with headings, paragraphs and inline styles"
            blocks: [graphics-clip, ui-focus, sidebar-pane, search-ui, toc-overlay]

      - ref: risk-spikes
        type: story
        title: Diagram and picture-clipping risks retired by spikes
        spec: SPEC.md#34-mermaid-diagrams
        priority: high
        tags: [foundation, spike]
        description: |
          The diagram pipeline (SPEC §3.4, §4.7) and picture clipping (SPEC §3.5.6) rely on library behaviour nobody has verified yet; discovering a gap late would invalidate several tasks.
          Two time-boxed spikes pin merman/resvg behaviour with learning tests and choose a clipping strategy for ratatui-image, each with a findings note in docs/spikes/.
          Done when both notes exist, their learning tests pass, and any contradiction with SPEC.md has been raised with the user.
        acceptance:
          - "docs/spikes/merman-resvg.md answers every question listed in the spike-merman task"
          - "docs/spikes/image-clipping.md records the chosen clipping strategy and its per-protocol limits"
          - "contradictions with SPEC §3.4 or §3.5 are raised with the user before dependent tasks start"
        children:
          - ref: spike-merman
            type: task
            title: "Spike: merman and resvg behaviour pinned by learning tests"
            spec: SPEC.md#34-mermaid-diagrams
            priority: high
            points: 3
            tags: [spike, diagram, raster]
            description: |
              SPEC §3.4 and §4.7 assume merman produces SVG with Mermaid's dark theme and a transparent background, offers ASCII/Unicode text output for some diagram types, reports errors with a usable message, and that resvg rasterises its SVG faithfully. None of this is verified, and the diagram, raster and layout tasks depend on it.
              Scope: learning tests (tests/spike_merman.rs) calling merman for flowchart, sequence, class, gantt and mindmap: SVG output; how to select the dark theme and a transparent background; which types support text output; the error type and message for a syntax error; whether malformed input can panic and that catch_unwind contains it. Rasterise each SVG with resvg (system fonts loaded through fontdb) and check that labels are drawn (e.g. not only inside foreignObject, which resvg ignores) and that the intrinsic size is available for the aspect ratio. Record API snippets, timings and spec contradictions in docs/spikes/merman-resvg.md.
              Done when the learning tests pass and the findings note answers each question above.
            acceptance:
              - "findings note lists SVG and text-output support for flowchart, sequence, class, gantt and mindmap"
              - "how to request the dark theme and a transparent background is documented with a code snippet"
              - "merman's error type, message format and panic behaviour are documented"
              - "resvg rasterisation of merman SVG with readable labels is confirmed, or a workaround is proposed"
              - "rasterisation time of a typical flowchart at 1000 px width is recorded"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "flowchart source produces an SVG document"
              - "dark theme option changes the SVG colours compared with the default theme"
              - "SVG background is transparent"
              - "invalid diagram source returns an error with a human-readable message"
              - "text output support is probed for each of the five showcase diagram types"
              - "a panic during rendering is caught by catch_unwind and reported as an error"
              - "resvg rasterises the flowchart SVG to a non-empty RGBA image of the requested width"
              - "rasterised flowchart contains label pixels (labels are not lost)"
            blocks: [diagram-wrapper, raster-svg]

          - ref: spike-clipping
            type: task
            title: "Spike: partially visible pictures clipped with ratatui-image"
            spec: SPEC.md#35-images-and-graphics
            priority: high
            points: 5
            tags: [spike, graphics]
            description: |
              SPEC §3.5.6 requires a partly scrolled picture to draw only its visible part, never over the sidebar, status bar or overlays, and to leave no fragments when scrolling. With Kitty, Sixel and iTerm2 the pixels live outside the cell grid, which makes this the riskiest UI part.
              Scope: an example binary (examples/clip_spike.rs) scrolling a tall PNG through a pane next to a sidebar and under a popup overlay; try ratatui-image's protocols (Kitty, Sixel, iTerm2, halfblocks) with candidate strategies (crop the source image to the visible rows and re-encode, protocol-native placement, explicit clearing/deletion of images on scroll); measure the re-encode cost per scroll step; define the picture-renderer trait plus the placeholder renderer used by snapshot tests. Record the chosen strategy and its limits in docs/spikes/image-clipping.md.
              Done when the chosen strategy leaves no fragments in WezTerm (Kitty and iTerm2) and with halfblocks, and the renderer trait with its placeholder implementation is merged with tests.
            acceptance:
              - "manual check in WezTerm: a picture scrolled half out of the pane shows only its visible part with Kitty and iTerm2, leaving no fragments"
              - "halfblocks rendering of the same scene is clipped correctly"
              - "in the example a picture never draws over the sidebar, the status bar or an overlay"
              - "findings note documents the strategy, per-protocol limits and per-scroll cost"
              - "picture-renderer trait and placeholder renderer exist for snapshot tests"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "visible-part calculation returns the slot rows that intersect the viewport"
              - "slot fully outside the viewport has no visible part"
              - "source crop for a slot scrolled half out of the top keeps the bottom half of the image"
              - "placeholder renderer fills only the visible part of a slot on TestBackend"
              - "cells covered by an overlay rectangle are excluded from the picture area"
            blocks: [graphics-detect, graphics-clip]

  # ===================================================================
  - ref: core-logic
    type: epic
    title: Terminal-independent document pipeline
    spec: SPEC.md#311-architecture-guidance
    priority: high
    tags: [core]
    description: |
      Most behaviour must be testable without a terminal (SPEC §3.11), so the pure modules come before the UI.
      This epic builds cli, doc, highlight, layout and tree: file -> document model -> rows, image slots and indexes for a given pane width and cell size, plus the folder tree for the sidebar.
      Done when the layout of any Markdown file at any width, and the tree of any folder, are produced and unit-tested without a terminal.
    acceptance:
      - "cli, doc, highlight, layout and tree are covered by unit tests that run without a terminal"
      - "every SPEC §3.3 element has a layout test or snapshot"
    children:
      - ref: cli
        type: story
        title: Command line validated before the TUI starts
        spec: SPEC.md#31-command-line
        priority: high
        tags: [cli]
        description: |
          The command line decides what the app opens and must reject bad input before touching the terminal (SPEC §3.1).
          Arguments, options, path validation and exit codes are implemented in the cli module and handed to the app as a start configuration.
          Done when bad invocations exit with code 2 and a clear message without entering the TUI.
        acceptance:
          - "readmd missing.md exits with code 2 and a clear message on stderr without entering the TUI"
          - "--protocol and --text-diagrams reach the app configuration"
        children:
          - ref: cli-args
            type: task
            title: Validated command-line arguments and exit codes
            spec: SPEC.md#31-command-line
            priority: high
            points: 3
            tags: [cli]
            description: |
              The app needs a validated start target and options before it enters the alternate screen (SPEC §3.1).
              Scope: clap derive for [PATH], --protocol <auto|kitty|sixel|iterm2|halfblocks> (default auto), --text-diagrams, -h/--help, -V/--version; PATH defaults to the current directory; a missing or unreadable path, or a file whose extension is not .md/.markdown/.mmd/.mermaid (case-insensitive), prints an error to stderr and exits with code 2. Output: a start target (file or directory) plus options.
              Done when unit tests on parsing and integration tests on the built binary pass.
            acceptance:
              - "all options of SPEC §3.1 are parsed with the documented defaults"
              - "invalid paths and unsupported extensions exit with code 2 before any terminal change"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "no PATH defaults to the current directory"
              - "--protocol accepts auto, kitty, sixel, iterm2 and halfblocks and rejects other values"
              - "--text-diagrams sets the initial diagram text mode"
              - "a file with an upper-case .MD extension is accepted"
              - "a directory path yields a directory target"
              - "missing path exits with code 2 and names the path on stderr"
              - "file with an unsupported extension exits with code 2 and lists the supported extensions"
              - "unreadable file exits with code 2"
              - "--version prints the version and exits with code 0"
            blocks: [ui-doc-pane, tree-start, graphics-detect]

      - ref: doc-model
        type: story
        title: Markdown and Mermaid files parsed into a document model
        spec: SPEC.md#33-markdown-rendering
        priority: high
        tags: [doc]
        description: |
          Layout, search and navigation all need a terminal-independent representation of the document (SPEC §2 "Document model").
          The doc module turns a .md/.markdown/.mmd/.mermaid file into blocks and inline spans, classifies images and links, and computes GitHub-style heading slugs.
          Done when every SPEC §3.3 element, images, diagrams, links and slugs are represented and unit-tested.
        acceptance:
          - "every element of the SPEC §3.3 table maps to a model block or span"
          - "lossy UTF-8 decoding and empty documents are flagged (SPEC §4.3, §4.4)"
          - "slugs follow GitHub rules including duplicate suffixes (SPEC §4.9)"
        children:
          - ref: doc-blocks
            type: task
            title: Document model for GFM text blocks and inline spans
            spec: SPEC.md#33-markdown-rendering
            priority: high
            points: 5
            tags: [doc]
            description: |
              The model is the input of every later stage; text blocks and inline styles are the bulk of it (SPEC §3.3).
              Scope: read bytes with lossy UTF-8 decoding and flag invalid input (SPEC §4.3); pulldown-cmark with tables, task lists, strikethrough and footnotes enabled; blocks: paragraph, heading H1-H6, nested ordered/unordered lists with task state, nested block quotes, code block with language, horizontal rule, HTML block; inline spans: text, emphasis, strong, strikethrough, inline code, link (target + text), inline HTML, soft/hard breaks; empty-document flag (SPEC §4.4); a .mmd/.mermaid file is a document with a single diagram block.
              Done when each element has a passing unit test.
            acceptance:
              - "all text blocks and inline spans of SPEC §3.3 are represented"
              - "pulldown-cmark runs with tables, task lists, strikethrough and footnotes enabled"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "heading levels 1 to 6 become heading blocks with their level and text"
              - "emphasis, strong, strikethrough and inline code become styled inline spans"
              - "nested ordered and unordered lists keep their depth and start number"
              - "task list items carry checked and unchecked state"
              - "nested block quotes keep their depth"
              - "fenced code block keeps its language and verbatim content"
              - "HTML blocks and inline HTML are kept as raw text"
              - "thematic break becomes a rule block"
              - "link spans carry their target and text"
              - "invalid UTF-8 is decoded lossily and the document is flagged as not valid UTF-8"
              - "empty file yields an empty document"
              - ".mmd file yields a document with a single diagram block"
            blocks: [doc-tables-images, doc-slugs-links, layout-paragraphs]

          - ref: doc-tables-images
            type: task
            title: Tables, footnotes, images and Mermaid blocks in the document model
            spec: SPEC.md#33-markdown-rendering
            priority: high
            points: 3
            tags: [doc]
            description: |
              Tables, footnotes, pictures and diagrams need structured data beyond plain text blocks (SPEC §3.3, §3.4, §3.5.2-4).
              Scope: table block with header cells, body rows (inline spans) and per-column alignment from the delimiter row; footnote references numbered by first use and definitions collected for the end of the document; images classified as local (path resolved relative to the document's directory) or remote (http/https), keeping the alt text; fenced blocks with language `mermaid` (matched case-insensitively, SPEC §4.15) become diagram blocks carrying the source.
              Done when each case has a passing unit test.
            acceptance:
              - "tables, footnotes, local/remote images and Mermaid blocks are represented in the model"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "table block keeps header cells, body rows and left, center, right and default alignment"
              - "footnote references are numbered in order of first use"
              - "footnote definitions are collected for the end of the document"
              - "relative image path is resolved against the document's directory"
              - "http and https image URLs are classified as remote and keep their alt text"
              - "mermaid fenced block becomes a diagram block with its source"
              - "fenced block with info string Mermaid or MERMAID is also a diagram block"
            blocks: [layout-lists-quotes, layout-tables, layout-slots]

          - ref: doc-slugs-links
            type: task
            title: GitHub-style heading slugs and link classification
            spec: SPEC.md#4-edge-cases-and-decisions
            priority: medium
            points: 2
            tags: [doc]
            description: |
              Anchor links and the TOC need heading slugs, and Enter needs to know what kind of link it activates (SPEC §3.6.2, §4.8, §4.9).
              Scope: slug function with GitHub rules (lowercase, spaces -> '-', punctuation removed, '-1', '-2' suffixes for duplicates in document order); link classification into external (http, https, mailto), anchor (#...) and unsupported (local paths, other schemes).
              Done when the slug and classification tests pass.
            acceptance:
              - "slugs match GitHub's output for the showcase headings"
              - "every link is classified as external, anchor or unsupported"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "slug lowercases the heading and turns spaces into hyphens"
              - "slug removes punctuation but keeps hyphens and underscores"
              - "duplicate headings get -1 and -2 suffixes in document order"
              - "slug keeps non-ASCII letters"
              - "http, https and mailto links are classified as external"
              - "links starting with # are classified as anchors"
              - "relative paths and other schemes are classified as unsupported"
            blocks: [layout-index]

      - ref: code-blocks
        type: story
        title: Code blocks rendered with syntax highlighting
        spec: SPEC.md#33-markdown-rendering
        priority: medium
        tags: [highlight, layout]
        description: |
          Developers read code in documentation; SPEC §3.3 asks for boxed, syntax-highlighted code blocks with a language label and no wrapping.
          The highlight module turns code into styled spans with syntect's dark theme, and the layout draws the box, the label and the truncation.
          Done when a highlighted code block lays out as specified at any width.
        acceptance:
          - "known languages are highlighted with a dark theme; unknown ones are plain"
          - "code blocks are boxed, labelled at the top right and truncated with an ellipsis"
        children:
          - ref: highlight-code
            type: task
            title: Syntect highlighting into styled spans
            spec: SPEC.md#33-markdown-rendering
            priority: medium
            points: 3
            tags: [highlight]
            description: |
              Code blocks must be syntax-highlighted with syntect using a dark theme; an unknown language falls back to plain text (SPEC §3.3).
              Scope: highlight module that loads the syntax set and the dark theme once, lazily, so start-up stays within the 300 ms first-paint budget (SPEC §5); language lookup by token or extension; output is lines of styled spans (foreground colour, bold, italic) with the exact original text.
              Done when the highlighting tests pass.
            acceptance:
              - "highlighting output preserves the text and carries colours for known languages"
              - "syntax set and theme are loaded once and lazily"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "Rust code is split into spans with more than one foreground colour"
              - "unknown language returns plain unstyled lines"
              - "code block without a language returns plain lines"
              - "language lookup accepts common aliases such as rs, py and sh"
              - "highlighting keeps the exact text of every line"
              - "syntax set is loaded once and reused across calls"
            blocks: [layout-code]

          - ref: layout-code
            type: task
            title: Code block boxes with language label and truncation
            spec: SPEC.md#33-markdown-rendering
            priority: medium
            points: 3
            tags: [layout]
            description: |
              SPEC §3.3 renders code blocks as a box with a background colour, the language label at the top right, and long lines truncated with an ellipsis instead of wrapped.
              Scope: layout of code blocks using the highlight output; box borders and background; label placement; truncation by display width; the same block shape is reused for diagram errors and text-mode fallbacks.
              Done when the layout tests for code blocks pass at several widths.
            acceptance:
              - "code blocks lay out as boxed, labelled, highlighted and truncated rows"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "code block is drawn inside a box with the code background colour"
              - "language label appears at the top right of the box"
              - "line longer than the box is truncated with an ellipsis and not wrapped"
              - "highlighted span colours are kept inside the box"
              - "truncation measures wide characters by display width"
            blocks: [layout-diagram-variants]

      - ref: text-layout
        type: story
        title: Document laid out for any pane width
        spec: SPEC.md#33-markdown-rendering
        priority: high
        tags: [layout]
        description: |
          The layout is the bridge between the model and the screen: rows for a width, plus the positions of headings, focusables and searchable text (SPEC §2 "Layout", §3.3).
          Paragraphs, headings, lists, quotes, footnotes and tables are laid out with wrapping and styles, and the indexes used by Tab, TOC, anchors and search are built.
          Done when every text element of SPEC §3.3 lays out correctly at several widths and the indexes are exposed.
        acceptance:
          - "every text element of SPEC §3.3 has a layout test"
          - "headings, focusables and searchable text are indexed with their rows"
        children:
          - ref: layout-paragraphs
            type: task
            title: Wrapped paragraphs, headings and rules in the layout
            spec: SPEC.md#33-markdown-rendering
            priority: high
            points: 3
            tags: [layout]
            description: |
              The vertical slice needs real text layout: wrapped paragraphs with inline styles and headings (SPEC §3.3, §4.4, §4.6).
              Scope: layout API (model + width + cell size -> rows of styled spans) with dark-theme style roles; 1-column left/right margins; word wrapping by display width with over-long words broken; per-level heading colour and bold with a rule row after H1/H2; emphasis, strong, strikethrough, inline code and link styles; horizontal rule; HTML as dimmed raw text; "too narrow" state below 20 columns and "empty document" state.
              Done when the paragraph and heading layout tests pass.
            acceptance:
              - "paragraphs, headings, rules and HTML lay out as specified in SPEC §3.3"
              - "too-narrow and empty states are produced by the layout"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "paragraph wraps at word boundaries within the width minus the two margin columns"
              - "word longer than the line is broken across rows"
              - "wide characters are measured by display width when wrapping"
              - "H1 and H2 are followed by a horizontal rule row and H3 is not"
              - "each heading level gets its own colour and bold"
              - "inline code, emphasis, strong, strikethrough and links get their styles"
              - "horizontal rule fills the content width with the box-drawing line character"
              - "HTML is laid out as dimmed raw text"
              - "width below 20 columns yields the too-narrow state"
            blocks: [layout-lists-quotes, layout-code, layout-tables, layout-slots, layout-index, ui-doc-pane]

          - ref: layout-lists-quotes
            type: task
            title: Lists, task lists, quotes and footnotes in the layout
            spec: SPEC.md#33-markdown-rendering
            priority: medium
            points: 3
            tags: [layout]
            description: |
              Nested structures need indentation, markers and hanging alignment (SPEC §3.3).
              Scope: bullets and numbers, 2 columns of indentation per level, wrapped lines aligned to the item text; task markers (empty and checked ballot boxes); a vertical bar per quote nesting level with dimmed text; footnote references as [n] and definitions listed at the end under a rule.
              Done when the list, quote and footnote layout tests pass.
            acceptance:
              - "lists, task lists, quotes and footnotes lay out as specified in SPEC §3.3"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "unordered items get bullets and ordered items get their numbers"
              - "nested list levels are indented two columns per level"
              - "wrapped item lines align with the item text, not the marker"
              - "task items show empty and checked ballot-box markers"
              - "each quote nesting level adds a vertical bar and the text is dimmed"
              - "footnote references render as [n]"
              - "footnote definitions are listed at the end of the document under a rule"
            blocks: [fixtures-showcase]

          - ref: layout-tables
            type: task
            title: Tables with borders, alignment and proportional shrinking
            spec: SPEC.md#33-markdown-rendering
            priority: medium
            points: 5
            tags: [layout]
            description: |
              GFM tables must stay readable at any width (SPEC §3.3).
              Scope: box-drawing borders, bold header row, column alignment from the delimiter row; natural column widths when they fit; when the table is wider than the pane, columns shrink proportionally and cell text wraps inside the cell, the row growing to its tallest cell; inline styles preserved through wrapping.
              Done when the table layout tests pass for narrow and wide panes.
            acceptance:
              - "tables lay out with borders, bold header and alignment at any width >= 20 columns"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "table is drawn with box-drawing borders and a bold header row"
              - "cells follow left, center and right alignment from the delimiter row"
              - "table that fits the pane keeps natural column widths"
              - "table wider than the pane shrinks its columns proportionally to fit"
              - "shrunk cell text wraps inside its column and the row grows to the tallest cell"
              - "cell inline styles survive wrapping"
            blocks: [perf-large, fixtures-showcase]

          - ref: layout-index
            type: task
            title: Heading, focusable and search indexes in the layout
            spec: SPEC.md#36-focus-links-and-full-screen-diagrams
            priority: medium
            points: 3
            tags: [layout]
            description: |
              Tab focus, anchors, the TOC and search all need positions in the laid-out document (SPEC §3.6, §3.9, §3.10).
              Scope: the Layout exposes headings (level, text, slug, row), focusables in document order (links with every wrapped fragment's row and columns plus target; diagrams with their slot rows) and searchable text per logical block (paragraph, list item, heading, quote line, table cell, code line; picture slots excluded) with a mapping from text offsets to the screen rows and columns it was wrapped into (SPEC §3.9.2, §4.14).
              Done when the index tests pass and indexes are recomputed with the layout for a new width.
            acceptance:
              - "headings, focusables and searchable text are available from the Layout"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "heading index lists level, text, slug and row in document order"
              - "a link wrapped over two rows is one focusable with two fragments"
              - "focusables are ordered by document position, mixing links and diagrams"
              - "a diagram focusable covers its slot rows"
              - "search text includes code block lines and table cell text"
              - "search text excludes picture slots"
              - "a text offset in a wrapped paragraph maps to the right screen row and column"
              - "index rows change when the layout is recomputed for another width"
            blocks: [ui-focus, search-engine, toc-overlay, perf-large]

      - ref: tree
        type: story
        title: Folder scanned into a sidebar tree with the right start file
        spec: SPEC.md#37-sidebar
        priority: medium
        tags: [tree]
        description: |
          The sidebar lists only the documents worth opening, and a directory argument must open a sensible first file (SPEC §3.1.1-2, §3.7.1-2).
          The tree module scans a folder with the ignore crate, filters and sorts entries, and derives root, sidebar visibility and initial file from the start target.
          Done when any folder yields the filtered, sorted tree and the correct initial file without a terminal.
        acceptance:
          - "the tree contains only supported files and the directories that lead to them, sorted as specified"
          - "start-up root, sidebar visibility and initial file follow SPEC §3.1"
        children:
          - ref: tree-scan
            type: task
            title: Folder scan with filtering, gitignore and sorting
            spec: SPEC.md#37-sidebar
            priority: medium
            points: 3
            tags: [tree]
            description: |
              The sidebar must show only directories and supported files, skipping hidden and ignored paths (SPEC §3.7.1-2).
              Scope: scan with the `ignore` crate; keep .md/.markdown/.mmd/.mermaid files (case-insensitive); skip dot-prefixed entries and .gitignore matches (also when the folder is not inside a git repository); drop directories with no supported file at any depth; sort directories first, then files, each case-insensitively.
              Done when the scan tests on temporary folders pass.
            acceptance:
              - "scan output matches SPEC §3.7.1-2 on a temporary folder with mixed content"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "only directories and .md, .markdown, .mmd and .mermaid files in any case are listed"
              - "dot-prefixed files and directories are skipped"
              - "paths matched by .gitignore are skipped"
              - ".gitignore is honoured even when the folder is not a git repository"
              - "directories without supported files at any depth are omitted"
              - "directories come before files and both are sorted case-insensitively"
            blocks: [tree-start, sidebar-nav]

          - ref: tree-start
            type: task
            title: Start-up root, sidebar visibility and initial file
            spec: SPEC.md#31-command-line
            priority: medium
            points: 2
            tags: [tree, cli]
            description: |
              SPEC §3.1.1-2 defines what is shown at start-up for a file or a directory argument.
              Scope: from the start target and the scanned tree compute the root (the file's parent or the directory), the initial sidebar visibility (hidden for a file, visible for a directory) and the initial document: README.md matched case-insensitively, else the first supported file in tree order, else the empty state.
              Done when the start-up decision tests pass.
            acceptance:
              - "start-up decisions follow SPEC §3.1.1-2 for file and directory targets"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "file target uses its parent directory as root and hides the sidebar"
              - "directory target shows the sidebar and opens README.md matched case-insensitively"
              - "directory without a README opens the first supported file in tree order"
              - "directory without supported files yields the empty state"
            blocks: [sidebar-pane]

  # ===================================================================
  - ref: pictures
    type: epic
    title: Diagrams and images drawn as pictures
    spec: SPEC.md#34-mermaid-diagrams
    priority: high
    tags: [pictures]
    description: |
      The reason readmd exists is to show Mermaid diagrams and local images as real pictures in the terminal, with a graceful fallback (SPEC §1, §3.4, §3.5).
      This epic wraps merman, rasterises SVG and bitmaps with resvg/image off the UI thread with a cache, reserves image slots in the layout, detects the graphics protocol and draws clipped pictures, and adds diagram text mode.
      Done when diagrams and images appear inside the document with every supported protocol and failures never break the document.
    acceptance:
      - "diagrams and local images render as pictures with Kitty, Sixel, iTerm2 and halfblocks"
      - "diagram errors, missing images and remote images degrade as SPEC §3.4.4 and §3.5.3-4 describe"
    children:
      - ref: diagram-render
        type: story
        title: Mermaid diagrams rendered safely, as pictures or as text
        spec: SPEC.md#34-mermaid-diagrams
        priority: high
        tags: [diagram]
        description: |
          A diagram must render, fail gracefully, or switch to text without ever breaking the document (SPEC §3.4.3-5, §4.7).
          A diagram module wraps merman; the layout gains the placeholder, error and text-mode variants of a diagram block; F8 and --text-diagrams toggle text mode.
          Done when a document with good, broken and text-mode diagrams lays out and renders as specified.
        acceptance:
          - "a merman error or panic shows the source in a red frame with the message and never affects the rest of the document"
          - "F8 and --text-diagrams switch every diagram to text output or the text-unavailable note"
        children:
          - ref: diagram-wrapper
            type: task
            title: merman wrapper returning SVG, text or a contained error
            spec: SPEC.md#34-mermaid-diagrams
            priority: high
            points: 3
            tags: [diagram]
            description: |
              The rest of the app needs one safe entry point to merman, applying the spike findings (SPEC §3.4.1, §3.4.4-5, §4.7).
              Scope: diagram module with source -> SVG (Mermaid dark theme, transparent background) and source -> text, returning a typed result: SVG, text, text-unavailable, or render error with merman's message; panics are caught with catch_unwind and turned into render errors; stable source hash for cache keys.
              Done when the wrapper tests pass for valid, invalid and panicking inputs.
            acceptance:
              - "no merman failure or panic escapes the diagram module"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "valid flowchart returns SVG with the dark theme and a transparent background"
              - "syntax error returns a render error carrying merman's message"
              - "panic inside merman is caught and returned as a render error"
              - "text mode returns ASCII/Unicode output for a diagram type that supports it"
              - "text mode for a type without text output returns the text-unavailable result"
              - "source hash is stable for identical sources and differs for different ones"
            blocks: [render-worker, layout-diagram-variants]

          - ref: layout-diagram-variants
            type: task
            title: Diagram placeholder, error and text-mode blocks in the layout
            spec: SPEC.md#34-mermaid-diagrams
            priority: medium
            points: 3
            tags: [layout, diagram]
            description: |
              A diagram block looks different while rendering, after a failure and in text mode (SPEC §3.4.3-5).
              Scope: layout of a diagram given its state: pending -> "Rendering diagram..." placeholder of the expected height (10 rows if unknown); ready -> image slot; error -> merman message above the source shown as a red-framed code block; text mode -> merman's text output, or the source as a code block with the note "Text rendering not available for this diagram type".
              Done when the variant layout tests pass.
            acceptance:
              - "each diagram state lays out as SPEC §3.4.3-5 describes"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "pending diagram reserves a 'Rendering diagram…' placeholder of the expected height"
              - "pending diagram of unknown size reserves 10 rows"
              - "failed diagram shows merman's message above its source in a red-framed code block"
              - "a failed diagram does not change the layout of the blocks after it"
              - "text mode lays out merman's text output instead of an image slot"
              - "text mode without text output shows the source with the note 'Text rendering not available for this diagram type'"
            blocks: [ui-pictures]

          - ref: ui-text-mode
            type: task
            title: Diagram text mode toggled with F8 or --text-diagrams
            spec: SPEC.md#34-mermaid-diagrams
            priority: medium
            points: 2
            tags: [ui, diagram]
            description: |
              Diagram text mode is a global toggle for terminals or users that prefer ASCII/Unicode diagrams (SPEC §3.4.5, §3.1).
              Scope: F8 toggles the mode and relayouts; --text-diagrams starts with it on; the status bar shows the mode while active.
              Done when toggling is covered by state and snapshot tests.
            acceptance:
              - "F8 and --text-diagrams behave as SPEC §3.4.5 describes and the status bar shows the mode"
              - "UI rendering covered by insta snapshots on TestBackend with the placeholder picture renderer (SPEC §5)"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "F8 toggles diagram text mode and recomputes the layout"
              - "--text-diagrams starts with text mode on"
              - "status bar shows the text-diagrams mode while it is on"
              - "snapshot of a document with a diagram in text mode"
            blocks: [acceptance-check]

      - ref: rasterisation
        type: story
        title: Pictures rasterised to size off the UI thread
        spec: SPEC.md#35-images-and-graphics
        priority: high
        tags: [raster]
        description: |
          Pictures must be sharp at the slot's exact pixel size, and rendering must never freeze the UI (SPEC §3.4.1, §3.4.3, §3.5.2).
          The raster module rasterises SVG and decodes bitmaps to scaled RGBA, caches results, and a background worker renders jobs and posts results to the UI.
          Done when diagrams and local images of every supported format are rasterised in the background at the requested size.
        acceptance:
          - "SVG, PNG, JPEG, GIF (first frame) and WebP become RGBA at the right size"
          - "rendering happens off the UI thread and results are cached by (source hash, pixel size)"
        children:
          - ref: raster-svg
            type: task
            title: SVG rasterised to an exact pixel width with a height cap
            spec: SPEC.md#34-mermaid-diagrams
            priority: high
            points: 3
            tags: [raster]
            description: |
              Diagrams are rasterised with resvg at their natural size, scaled down only to fit the content width or the pane height, never scaled up (SPEC §3.4.1, §4.12).
              Scope: raster function (SVG, max width px, max height px) -> RGBA at natural size or scaled down to fit, aspect ratio kept; system fonts loaded once into a shared fontdb; intrinsic size query for slot sizing before rasterising.
              Done when the SVG rasterisation tests pass.
            acceptance:
              - "SVG output keeps its natural size when it fits and is only scaled down otherwise, aspect ratio kept"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "SVG smaller than the limits is rasterised at its natural size, not enlarged"
              - "SVG wider than the max width is scaled down to that width keeping the aspect ratio"
              - "a picture taller than the cap is scaled down so its height equals the cap"
              - "transparent background stays transparent in the RGBA output"
              - "text in the SVG is drawn with system fonts"
              - "intrinsic size of an SVG is reported without rasterising it"
              - "invalid SVG returns an error"
            blocks: [raster-bitmaps, raster-cache]

          - ref: raster-bitmaps
            type: task
            title: Local images decoded and scaled down to fit
            spec: SPEC.md#35-images-and-graphics
            priority: medium
            points: 3
            tags: [raster]
            description: |
              Local images must display in PNG, JPEG, GIF (first frame), SVG and WebP, scaled to fit but never enlarged (SPEC §3.5.2-3).
              Scope: decode with the image crate (SVG through raster-svg); scale down to the pane width, never above natural size, capped at the pane height, aspect ratio kept; cheap dimension query for slot sizing; missing or corrupt files return a not-found error.
              Done when the decode and scaling tests pass on small test images.
            acceptance:
              - "all formats of SPEC §3.5.2 decode and scale as specified"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "PNG, JPEG, WebP and GIF files decode to RGBA"
              - "animated GIF uses its first frame"
              - "SVG image file is rasterised through resvg"
              - "image wider than the pane is scaled down to the pane width"
              - "image smaller than the pane keeps its natural size"
              - "image taller than the pane is capped at the pane height keeping the aspect ratio"
              - "image dimensions are read without decoding the whole file"
              - "missing or corrupt file returns a not-found error"
            blocks: [render-worker]

          - ref: raster-cache
            type: task
            title: In-memory picture cache keyed by source and pixel size
            spec: SPEC.md#34-mermaid-diagrams
            priority: medium
            points: 2
            tags: [raster]
            description: |
              Re-rasterising on every scroll or redraw would be wasteful; SPEC §3.4.3 caches pictures in memory by (source hash, target pixel size).
              Scope: thread-safe cache keyed by (source hash, width, height) for diagrams and images; lookups are cheap; entries for a changed source or size are misses; least-recently-used eviction once stored pixel data exceeds 256 MB (SPEC §4.13), with the limit configurable in tests.
              Done when the cache tests pass.
            acceptance:
              - "the cache returns stored pictures for the same key and misses otherwise"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "same source hash and pixel size returns the cached picture without re-rendering"
              - "a different pixel size for the same source is a cache miss"
              - "a changed source is a cache miss"
              - "the cache can be shared between the worker and the UI thread"
              - "exceeding the byte limit evicts the least recently used entries first"
              - "a lookup refreshes an entry so it is not the next to be evicted"
            blocks: [render-worker]

          - ref: render-worker
            type: task
            title: Background render worker for diagrams and images
            spec: SPEC.md#34-mermaid-diagrams
            priority: high
            points: 3
            tags: [raster, diagram]
            description: |
              Rendering must happen off the UI thread so first paint and scrolling stay fast (SPEC §3.4.3, §4.5, §5 first paint).
              Scope: worker thread(s) receiving render jobs (diagram source or image path, target pixel size, generation), running diagram + raster, filling the cache and posting results (picture or error) to the UI event channel; duplicate jobs coalesced; results of a superseded generation (e.g. old width) discarded.
              Done when the worker tests pass with a fake renderer.
            acceptance:
              - "submitting a job never blocks the caller and results arrive as UI events"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "a render job completes on a worker thread and posts its result to the UI channel"
              - "submitting a job returns immediately while a slow job renders"
              - "duplicate jobs for the same key are rendered once"
              - "results of a superseded generation are discarded"
              - "a render error is delivered as an error result"
            blocks: [ui-pictures]

      - ref: graphics
        type: story
        title: Pictures drawn in the document with the best available protocol
        spec: SPEC.md#35-images-and-graphics
        priority: high
        tags: [graphics, ui]
        description: |
          Users should see sharp pictures where the terminal supports them and halfblocks elsewhere, without fragments when scrolling (SPEC §3.5).
          Image slots are reserved in the layout, the graphics protocol is detected, pictures are drawn clipped to the document pane, rendered lazily, and re-rasterised after a resize.
          Done when `readmd` on a document with diagrams and images shows them in place with every protocol and scrolling is clean.
        acceptance:
          - "pictures appear in their slots, centred, with Kitty, Sixel, iTerm2 or halfblocks"
          - "partly visible pictures are clipped and never draw over sidebar, status bar or overlays"
          - "only pictures within one screen of the viewport are rasterised"
        children:
          - ref: layout-slots
            type: task
            title: Image slots and fallback rows in the layout
            spec: SPEC.md#35-images-and-graphics
            priority: high
            points: 3
            tags: [layout, graphics]
            description: |
              Text must never overlap pictures, so the layout reserves whole rows for them (SPEC §3.4.1-2, §3.5.2-5).
              Scope: image slot = ceil(pixel_height / cell_pixel_height) rows; diagram and local image slots use the picture's natural pixel size, scaled down to fit the content width (pane width in columns x cell pixel width) and the pane height, never scaled up (SPEC §4.12); horizontal centring offset; missing image -> one dimmed row "[image not found: <path>]" plus alt text; remote image -> one dimmed row "[remote image: <url>]" plus alt text, with no network access.
              Done when the slot tests pass for diagrams, local, missing and remote images.
            acceptance:
              - "slots follow SPEC §3.5.5 and never overlap text"
              - "missing and remote images produce the dimmed rows of SPEC §3.5.3-4"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "slot rows equal ceil(pixel height / cell pixel height)"
              - "a small diagram's slot keeps its natural size and is not stretched to the pane width"
              - "a wide diagram's slot is scaled down to the content width and its height is capped at the pane height"
              - "image slot never exceeds the image's natural size"
              - "picture is centred horizontally in the content area"
              - "missing image becomes one dimmed '[image not found: path]' row with the alt text"
              - "remote image becomes one dimmed '[remote image: url]' row with the alt text"
              - "no text row overlaps a slot"
            blocks: [layout-index, layout-diagram-variants]

          - ref: graphics-detect
            type: task
            title: Graphics protocol detection with override and cell size
            spec: SPEC.md#35-images-and-graphics
            priority: medium
            points: 3
            tags: [graphics]
            description: |
              Pictures need the best protocol the terminal supports and the cell size in pixels (SPEC §3.5.1, §4.10).
              Scope: unless --protocol forces one, query Kitty, then Sixel, then iTerm2 through ratatui-image, falling back to halfblocks; read the cell pixel size, assuming 10x20 px when unavailable; detection failure (e.g. tmux without allow-passthrough) means halfblocks; detection hidden behind a trait so tests can inject results.
              Done when the selection logic is unit-tested and manual detection works in WezTerm.
            acceptance:
              - "protocol and cell size are chosen as SPEC §3.5.1 describes"
              - "manual check: WezTerm is detected as Kitty or iTerm2"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "--protocol kitty, sixel, iterm2 or halfblocks skips detection and uses that protocol"
              - "auto mode tries Kitty, then Sixel, then iTerm2 and falls back to halfblocks"
              - "unknown cell size falls back to 10x20 pixels"
              - "detection failure selects halfblocks"
            blocks: [ui-pictures]

          - ref: graphics-clip
            type: task
            title: Pictures drawn clipped to the document pane
            spec: SPEC.md#35-images-and-graphics
            priority: high
            points: 5
            tags: [graphics, ui]
            description: |
              SPEC §3.5.6: a partly scrolled picture shows only its visible part, never over the sidebar, status bar or overlays, and scrolling leaves no fragments.
              Scope: production implementation of the strategy chosen in spike-clipping inside the graphics module: compute the visible part of each slot, crop/encode per protocol through ratatui-image, draw within the document pane only, exclude overlay rectangles, clear pictures that leave the view; the placeholder renderer is used in snapshot tests.
              Done when the clipping tests pass and the manual scroll check in WezTerm shows no fragments.
            acceptance:
              - "manual check in WezTerm (Kitty and iTerm2): scrolling a picture in and out of view leaves no fragments"
              - "UI rendering covered by insta snapshots on TestBackend with the placeholder picture renderer (SPEC §5)"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "slot partly above the viewport draws only its visible lower part"
              - "slot partly below the viewport draws only its visible upper part"
              - "picture never writes cells outside the document pane"
              - "an overlay covering a picture hides the covered part"
              - "a picture scrolled out of view is cleared"
            blocks: [ui-pictures]

          - ref: ui-pictures
            type: task
            title: Diagrams and images appear inside the document
            spec: SPEC.md#34-mermaid-diagrams
            priority: high
            points: 5
            tags: [ui, graphics]
            description: |
              This connects the picture pipeline to the viewer: the user finally sees diagrams and images in place (SPEC §3.4.2-4, §3.5, §4.5).
              Scope: when a slot comes within one screen of the viewport, submit its render job; show the placeholder until the result arrives, then relayout with the real slot height while keeping the reading position; draw ready pictures through graphics-clip; show error blocks for failed diagrams and fallback rows for missing/remote images; reuse cached pictures when scrolling back.
              Done when a document with diagrams and images renders correctly in state and snapshot tests and manually in WezTerm.
            acceptance:
              - "diagrams and local images appear in their slots; failed diagrams show the error block"
              - "rasterisation is lazy: only slots within one screen of the viewport are rendered (SPEC §4.5)"
              - "UI rendering covered by insta snapshots on TestBackend with the placeholder picture renderer (SPEC §5)"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "diagram slot shows the rendering placeholder until its picture arrives"
              - "an arriving picture triggers a relayout with the real slot height and keeps the reading position"
              - "only slots within one screen of the viewport are submitted for rendering"
              - "scrolling a slot into range submits its render job once"
              - "cached pictures are reused when scrolling back"
              - "a failed diagram shows the error block while the rest of the document renders"
              - "snapshot of a document with a diagram, a local image, a missing image and a remote image"
            blocks: [ui-resize-rerender, ui-text-mode, fullscreen-view, perf-large, fixtures-showcase]

          - ref: ui-resize-rerender
            type: task
            title: Pictures re-rasterised after a debounced resize
            spec: SPEC.md#34-mermaid-diagrams
            priority: medium
            points: 3
            tags: [ui, raster]
            description: |
              After a terminal resize the pictures must match the new width without re-rendering on every intermediate size (SPEC §3.4.6).
              Scope: on resize relayout immediately; slots whose pixel size changed show the placeholder; re-rasterisation jobs are submitted once no resize arrived for ~150 ms; superseded results are discarded; the debounce uses an injectable clock for tests.
              Done when the debounce tests pass and a manual resize in WezTerm re-renders the pictures sharply.
            acceptance:
              - "resizing the terminal re-rasterises pictures for the new width after ~150 ms of quiet"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "resize relayouts immediately and re-rasterises once after 150 ms without further resizes"
              - "a burst of resize events triggers a single re-rasterisation"
              - "slots whose pixel size changed show the placeholder until the new picture arrives"
              - "results rendered for the old width are discarded"
            blocks: [acceptance-check]

  # ===================================================================
  - ref: viewer
    type: epic
    title: Keyboard-driven navigation of documents and folders
    spec: SPEC.md#38-keys-document-focus
    priority: medium
    tags: [viewer]
    description: |
