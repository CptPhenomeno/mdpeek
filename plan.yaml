              - "Tab focuses the next focusable in document order and Shift+Tab the previous"
              - "Tab after the last focusable wraps to the first"
              - "focusing an item outside the viewport scrolls it into view"
              - "Esc clears the focus"
              - "the focused link is drawn in reverse video"
              - "focus stays on the same item after a relayout"
            blocks: [ui-activate]

