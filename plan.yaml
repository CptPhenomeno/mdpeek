      This epic adds focus and activation, the full-screen diagram view, the sidebar, search, the TOC and help overlays and reload.
      Done when every key of SPEC §3.6-§3.10 works as specified and is listed in the F1 help.
    acceptance:
      - "every key of SPEC §3.6-§3.10 works as specified"
      - "F1 help lists every key"
    children:
      - ref: focus-links
        type: story
        title: Links and diagrams reachable and activated from the keyboard
        spec: SPEC.md#36-focus-links-and-full-screen-diagrams
        priority: medium
        tags: [ui]
        description: |
          Without a mouse, the user needs Tab to reach links and diagrams and Enter to act on them (SPEC §3.6.1-2).
          Focus cycling with scrolling into view, and activation of external links, anchors, unsupported links and diagrams.
          Done when Tab/Shift+Tab/Esc/Enter behave as specified on a document with every kind of link and a diagram.
