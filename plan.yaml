      - ref: fullscreen
        type: story
        title: Diagrams explored full screen with zoom and pan
        spec: SPEC.md#36-focus-links-and-full-screen-diagrams
        priority: medium
        tags: [ui, diagram]
        description: |
          Large diagrams are unreadable in a narrow pane; the full-screen view lets the user zoom and pan (SPEC §3.6.3).
          A pure zoom/pan state machine plus the view that re-rasterises the SVG at the zoom scale and shows the visible region, or the scrollable text output in text mode.
          Done when a diagram can be opened, zoomed, panned and closed back to the same document position.
        acceptance:
          - "every key of the SPEC §3.6.3 table works as specified"
          - "zoom re-rasterises from the SVG (no pixel upscaling) and the status bar shows the zoom percentage"
        children:
          - ref: fullscreen-state
            type: task
            title: Zoom and pan state for the full-screen view
            spec: SPEC.md#36-focus-links-and-full-screen-diagrams
            priority: medium
            points: 3
            tags: [ui]
            description: |
              Zoom and pan rules are pure logic and should be tested without a terminal (SPEC §3.6.3).
              Scope: state with fit scale, zoom factor and viewport offset: +/= zoom in x1.25 up to x8, - zoom out /1.25 down to fit, 0/Home reset to fit, arrows pan by 10% of the visible area only when the picture exceeds the screen, offsets clamped to the picture, zoom keeps the viewport centre; zoom percentage for the status bar.
              Done when the state tests pass.
            acceptance:
              - "zoom and pan rules of SPEC §3.6.3 are implemented as pure, tested logic"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "+ and = zoom in by 1.25 up to 8 times the fit scale"
              - "- zooms out by 1.25 down to the fit scale"
              - "0 and Home reset to fit"
              - "arrow keys pan by 10% of the visible area when zoomed beyond the screen"
              - "arrow keys do nothing while the picture fits the screen"
              - "pan offset is clamped to the picture edges"
              - "zooming keeps the viewport centre"
              - "zoom percentage is reported relative to the fit scale"
            blocks: [fullscreen-view]

          - ref: fullscreen-view
            type: task
            title: Full-screen diagram view with re-rasterised zoom
            spec: SPEC.md#36-focus-links-and-full-screen-diagrams
            priority: medium
            points: 5
            tags: [ui, raster]
            description: |
              The view replaces everything but the status bar and must stay sharp at every zoom level (SPEC §3.2, §3.6.3).
              Scope: open from Enter on a diagram; rasterise to fit the screen minus the status bar, centred; on zoom re-rasterise from the SVG at the new scale, rendering only the visible region so x8 zoom does not allocate a huge bitmap; pan redraws the region; status bar shows the zoom percentage; Esc returns with the same scroll position and focus; in diagram text mode show the text output scrollable with the arrow keys.
              Done when the view's state and snapshot tests pass and zoom/pan work manually in WezTerm.
            acceptance:
              - "full-screen view behaves as SPEC §3.6.3 describes in image and text mode"
              - "memory stays bounded at maximum zoom (only the visible region is rasterised)"
              - "UI rendering covered by insta snapshots on TestBackend with the placeholder picture renderer (SPEC §5)"
              - "Common DoD (SPEC §5) met: tests first; fmt, clippy -D warnings and cargo test clean; no unwrap/expect outside tests and start-up without a comment; English only; no AI attribution in commits"
            tests:
              - "opening the view rasterises the diagram to fit the screen minus the status bar, centred"
              - "zooming re-rasterises from the SVG at the new scale instead of upscaling pixels"
              - "at maximum zoom only the visible region is rasterised"
              - "status bar shows the zoom percentage"
              - "Esc returns to the document with the same scroll position and focus"
              - "in text mode the view shows the text output, scrollable with the arrow keys"
              - "snapshot of the full-screen view with the placeholder renderer"
            blocks: [acceptance-check]

